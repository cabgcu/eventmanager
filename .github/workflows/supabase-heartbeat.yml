name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://knlmtrzxtqcmgaydwzqz.supabase.co/rest/v1/app_state?id=eq.master_index&select=id" \
            -H "apikey: sb_publishable_9ROUJP2trRbgsbnrCB5K9g_KXSwis3O" \
            -H "Authorization: Bearer sb_publishable_9ROUJP2trRbgsbnrCB5K9g_KXSwis3O")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: unexpected status $STATUS"
            exit 1
          fi
